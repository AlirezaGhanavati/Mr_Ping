# Attaches doctor-dns.sh to a release when it is published. The panel's
# "New version from GitHub" button looks for exactly this file on the latest
# release and installs it only if its hash is the one GitHub recorded.
name: attach installer to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to attach the installer to, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: the committed installer is what its sources build
        run: |
          python3 tools/build-installer.py
          git -c core.fileMode=false diff --exit-code -- doctor-dns.sh

      - name: the installer's version is the release's
        run: |
          v="$(sed -n 's/^VERSION="\([0-9.]*\)"$/\1/p' doctor-dns.sh | head -1)"
          [ "v$v" = "$TAG" ] || { echo "release $TAG, installer says $v"; exit 1; }

      - name: attach it
        run: gh release upload "$TAG" doctor-dns.sh --clobber --repo "$GITHUB_REPOSITORY"
